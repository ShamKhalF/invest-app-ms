  - changeSet:
      id: 002-insert-roles-dynamic
      author: system
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: 'SUPER_ADMIN' }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: 'USER_MANAGER' }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: 'ROLE_MANAGER' }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: 'CUSTOMER' }

  - changeSet:
      id: 003-insert-role-permissions-dynamic
      author: system
      changes:
        - sql:
            splitStatements: true
            sql: >
              INSERT INTO role_permission (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.name = 'SUPER_ADMIN' 
              AND p.name IN (
                'permission:add', 'permission:update', 'permission:delete', 'permission:read',
                'role:add', 'role:update', 'role:delete', 'role:remove_permissions', 'role:read',
                'user:add', 'user:update', 'user:deactivate', 'user:delete', 'user:update_roles', 'user:update_password', 'user:read',
                'wallet:write', 'wallet:read', 'order:write', 'order:read', 'stream:start', 'stream:stop', 'telegram:read', 'telegram:delete'
                );

              INSERT INTO role_permission (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.name = 'USER_MANAGER' 
              AND p.name IN (
                'user:add', 'user:update', 'user:deactivate', 'user:delete', 'user:update_roles', 'user:update_password', 'user:read',
                'wallet:write', 'wallet:read', 'order:write', 'order:read', 'telegram:read', 'telegram:delete'
                );

              INSERT INTO role_permission (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.name = 'ROLE_MANAGER' 
              AND p.name IN (
                'permission:add', 'permission:update', 'permission:delete', 'permission:read',
                'role:add', 'role:update', 'role:delete', 'role:remove_permissions', 'role:read', 'telegram:read', 'telegram:delete'
              );

              INSERT INTO role_permission (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.name = 'CUSTOMER' 
              AND p.name IN (
                'wallet:write', 'wallet:read', 'order:write', 'order:read', 'telegram:read', 'telegram:delete'
              );