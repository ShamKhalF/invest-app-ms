databaseChangeLog:
  - changeSet:
      id: 1.3.2-add-column-times-to-user
      author: ShLF
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false