plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'az.shlf'
version = '0.0.1-SNAPSHOT'
description = 'market-data-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.1")
}

dependencies {
    // 1. Standart Web (Tomcat, REST API-lər üçün)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'


    // 2. Reactive Web (Sadəcə WebClient-i istifadə etmək üçün)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 3. WebSocket (Binance wss:// üçün)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 4. Feign Client (Digər daxili MS-lərlə danışmaq üçün)
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // 5. Redis (Keşləmə və Session üçün)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 6. Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Verilənlər bazası və JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql' // MySQL istifadə edirsinizsə, uyğun driveri qoyun

    // Kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // 7. Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // Testlər
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test' // WebFlux (WebClient) testləri üçün
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
